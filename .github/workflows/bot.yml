name: ai-news-bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: ai-news-bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WEIR_API_KEY: ${{ secrets.WEIR_API_KEY }}
          WEIR_API_KEY_2: ${{ secrets.WEIR_API_KEY_2 }}
          WEIR_API_KEY_3: ${{ secrets.WEIR_API_KEY_3 }}
          QUIET_START_UTC: ${{ vars.QUIET_START_UTC }}
          QUIET_END_UTC: ${{ vars.QUIET_END_UTC }}
          SLEEP_START_UTC: ${{ vars.SLEEP_START_UTC }}
          SLEEP_END_UTC: ${{ vars.SLEEP_END_UTC }}
      - name: Save state
        run: |
          git config user.name "ai-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
